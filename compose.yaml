# Local defaults. DB_PASSWORD=notes is a dev fallback, override it in the environment.
services:
  db:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: notes
      MYSQL_USER: notes
      MYSQL_PASSWORD: ${DB_PASSWORD:-notes}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-notes}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -unotes -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_NAME: Notes
      APP_ENV: local
      APP_DEBUG: "true"
      # Local fallback. Not a production secret.
      APP_KEY: ${APP_KEY:-base64:CO/mzIA+8kOAQbsR0rqtSDzP2EqC42fYmyjSvkt5rls=}
      APP_URL: http://127.0.0.1:8080
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: notes
      DB_USERNAME: notes
      DB_PASSWORD: ${DB_PASSWORD:-notes}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  db-data:
